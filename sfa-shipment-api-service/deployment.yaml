apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfa-shipment-api-service
  namespace: sfa-shipment-api-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sfa-shipment-api-service
  template:
    metadata:
      labels:
        app: sfa-shipment-api-service
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: sfa-shipment-api-service
        image: 10.10.10.202/pico/sfa-shipment-api-service:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sfa-shipment-api-service
  namespace: sfa-shipment-api-service
spec:
  selector:
    app: sfa-shipment-api-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
