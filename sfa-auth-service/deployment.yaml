apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfa-auth-service
  namespace: sfa-auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sfa-auth-service
  template:
    metadata:
      labels:
        app: sfa-auth-service
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: sfa-auth-service
        image: 10.10.10.202/pico/sfa-auth-service:v2
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
