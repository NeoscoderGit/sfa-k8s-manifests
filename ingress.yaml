apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sfa-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: sfa.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sfa-web-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: sfa-api-gateway
            port:
              number: 80
      - path: /auth
        pathType: Prefix
        backend:
          service:
            name: sfa-auth-service
            port:
              number: 80
      - path: /app
        pathType: Prefix
        backend:
          service:
            name: sfa-app-service
            port:
              number: 80
      - path: /dashboard
        pathType: Prefix
        backend:
          service:
            name: sfa-dashboard-service
            port:
              number: 80
      - path: /master-data
        pathType: Prefix
        backend:
          service:
            name: sfa-master-data-service
            port:
              number: 80
      - path: /partner
        pathType: Prefix
        backend:
          service:
            name: sfa-partner-api-service
            port:
              number: 80
      - path: /reports
        pathType: Prefix
        backend:
          service:
            name: sfa-reports-service
            port:
              number: 80
      - path: /sales
        pathType: Prefix
        backend:
          service:
            name: sfa-sales-management-service
            port:
              number: 80
      - path: /shipment
        pathType: Prefix
        backend:
          service:
            name: sfa-shipment-api-service
            port:
              number: 80
      - path: /stock
        pathType: Prefix
        backend:
          service:
            name: sfa-stock-management-service
            port:
              number: 80
      - path: /survey
        pathType: Prefix
        backend:
          service:
            name: sfa-survey-service
            port:
              number: 80
      - path: /trade
        pathType: Prefix
        backend:
          service:
            name: sfa-trade-marketing
            port:
              number: 80
