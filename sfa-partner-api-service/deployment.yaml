apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfa-partner-api-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sfa-partner-api-service
  template:
    metadata:
      labels:
        app: sfa-partner-api-service
    spec:
      imagePullSecrets:
      - name: harbor-secret
      containers:
      - name: sfa-partner-api-service
        image: 10.10.10.202/pico/sfa-partner-api-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sfa-partner-api-service
  namespace: default
spec:
  selector:
    app: sfa-partner-api-service
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
