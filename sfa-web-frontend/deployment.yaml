apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfa-web-frontend
  namespace: sfa-web-frontend
spec:
  replicas: 5
  selector:
    matchLabels:
      app: sfa-web-frontend
  template:
    metadata:
      labels:
        app: sfa-web-frontend
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: sfa-web-frontend
        image: 10.10.10.202/pico/sfa-web-frontend:v12
        imagePullPolicy: Always
        ports:
        - containerPort: 2091
        envFrom:
        - secretRef:
            name: sfa-web-frontend-env
