apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfa-web-frontend
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sfa-web-frontend
  template:
    metadata:
      labels:
        app: sfa-web-frontend
    spec:
      imagePullSecrets:
      - name: harbor-secret
      containers:
      - name: frontend
        image: 10.10.10.202/pico/sfa-web-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: sfa-web-frontend
  namespace: default
spec:
  selector:
    app: sfa-web-frontend
  ports:
  - port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sfa-web-frontend
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: frontend.sfa.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: sfa-web-frontend
            port:
              number: 80
