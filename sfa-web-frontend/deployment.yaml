apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfa-web-frontend
  namespace: sfa-web-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sfa-web-frontend
  template:
    metadata:
      labels:
        app: sfa-web-frontend
    spec:
      imagePullSecrets:
      - name: harbor-registry-secret
      containers:
      - name: sfa-web-frontend
        image: 10.10.10.202/pico/sfa-web-frontend:v7
        imagePullPolicy: Always
        ports:
        - containerPort: 2091
        envFrom:
        - secretRef:
            name: sfa-web-frontend-env
        volumeMounts:
        - name: next-config
          mountPath: /app/next.config.js
          subPath: next.config.js
        - name: i18n
          mountPath: /app/i18n
      volumes:
      - name: next-config
        configMap:
          name: sfa-web-frontend-config
      - name: i18n
        configMap:
          name: sfa-web-frontend-i18n
---
apiVersion: v1
kind: Service
metadata:
  name: sfa-web-frontend
  namespace: sfa-web-frontend
spec:
  selector:
    app: sfa-web-frontend
  ports:
  - port: 80
    targetPort: 2091
    nodePort: 30090
  type: NodePort
